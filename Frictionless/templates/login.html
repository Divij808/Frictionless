<!DOCTYPE html>
<html lang="en">
<head>
    <title>Frictionless - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">Login to Frictionless</h2>
        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Login</button>
        </form>
        <div class="flex justify-between text-sm mt-4">
            <a href="/forgot-password" class="text-gray-500 hover:text-indigo-600">Forgot password?</a>
            <a href="/signup" class="text-indigo-600">Sign Up</a>
        </div>
    </div>
</body>
</html>
